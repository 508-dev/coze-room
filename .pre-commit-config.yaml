repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: bun run format:check
        language: system
        pass_filenames: false
        # Scoped to source and root tooling. Keep this regex in step with the
        # workspace layout in package.json -- if it drifts, the hook silently
        # stops covering most of the repo.
        files: ^(apps/|packages/|scripts/|biome\.json$|package\.json$|tsconfig\.json$)
