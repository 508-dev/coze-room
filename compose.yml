services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dormouse}
      POSTGRES_USER: ${POSTGRES_USER:-dormouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dormouse}
    ports:
      # Bind to localhost by default. scripts/docker-compose.sh injects
      # worktree-specific host ports so parallel workspaces do not fight over
      # one fixed Postgres port.
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-8740}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dormouse} -d ${POSTGRES_DB:-dormouse}"]
      interval: 10s
      timeout: 3s
      retries: 10

# No Redis. Room state lives in the server process memory; at ~9 concurrent
# rooms a second datastore buys nothing. Revisit only if we outgrow one process
# and need to route by room id across several.

volumes:
  postgres-data:
